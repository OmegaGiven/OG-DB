<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG-DB</title>
<style>
  :root{
    --bg:#f3f4f6;--surface:#fff;--ink:#1a1d23;--ink-soft:#565d6b;
    --line:#d7dbe0;--line-strong:#bcc2cb;--accent:#c8791f;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101216;--surface:#181b21;--ink:#e9ebef;--ink-soft:#9aa2b0;--line:#2c313a;--line-strong:#3b414c;--accent:#e8a33d}
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.6;padding:clamp(28px,7vw,72px) clamp(16px,5vw,32px)
  }
  main{max-width:640px;margin:0 auto}
  h1{font-size:15px;letter-spacing:.28em;text-transform:uppercase;margin:0 0 28px;color:var(--accent)}
  ul{list-style:none;padding:0;margin:0}
  a.db{
    display:flex;justify-content:space-between;gap:12px;
    text-decoration:none;color:inherit;font-size:14px;font-weight:600;
    border:1px solid var(--line-strong);background:var(--surface);
    padding:16px 18px;transition:border-color .12s
  }
  a.db:hover,a.db:focus-visible{border-color:var(--accent);outline:none}
  a.db span:last-child{color:var(--accent)}
  .request{
    margin:14px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.6
  }
  .request a{color:var(--accent);text-decoration:none}
  .request a:hover,.request a:focus-visible{text-decoration:underline}
  footer{margin-top:44px;font-size:11px;color:var(--ink-soft)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>OG-DB</h1>
  <ul>
    <li>
      <a class="db" href="headsets/"><span>Headset DB</span><span>open &rarr;</span></a>
    </li>
  </ul>
  <p class="request">
    Want a row added, a spec corrected, a database updated, or a whole new
    database for another product line?
    <a href="https://github.com/OmegaGiven/OG-DB/issues/new/choose">Open a request &rarr;</a>
    <br>
    Or browse <a href="https://github.com/OmegaGiven/OG-DB/issues">existing requests</a>.
  </p>
  <footer>Source: <a href="https://github.com/OmegaGiven/OG-DB">github.com/OmegaGiven/OG-DB</a></footer>
</main>
</body>
</html>
